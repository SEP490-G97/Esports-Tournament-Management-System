<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duyệt đăng ký giải · ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <div id="site-header"></div>
    <main class="container-etoms">
        <div class="page-head">
            <div class="eyebrow">Công cụ ban tổ chức</div>
            <h1 id="tournament-name">Xét duyệt đăng ký</h1>
            <p>Xem hồ sơ đăng ký, đội hình và lịch sử kỷ luật để chuẩn bị xét duyệt.</p>
        </div>
        <div class="dev-banner" role="note">Chỉ người tạo giải được phép thao tác. Tài liệu định danh chỉ hiển thị trong phạm vi đơn đăng ký của giải đó.</div>
        <div id="registration-flash" aria-live="polite"></div>
        <section class="card-etoms registration-panel mb-4">
            <h2>Suất và bộ lọc</h2>
            <div id="registration-capacity" class="feature-list-item"></div>
            <div class="registration-field-grid mt-3">
                <div class="field">
                    <label for="status-filter">Trạng thái</label>
                    <select id="status-filter" class="select">
                        <option value="ALL">Tất cả</option>
                        <option value="PENDING">Chờ xét duyệt</option>
                        <option value="APPROVED">Đã duyệt</option>
                        <option value="REJECTED">Từ chối</option>
                        <option value="WAITLISTED">Danh sách chờ</option>
                        <option value="WITHDRAWN">Đã rút</option>
                        <option value="EXPIRED">Hết hạn</option>
                    </select>
                </div>
                <div class="field">
                    <label for="team-search">Tìm đội</label>
                    <input id="team-search" class="input" type="search" placeholder="Tên hoặc tag đội" />
                </div>
            </div>
        </section>
        <section class="registration-panel">
            <h2>Đơn đăng ký</h2>
            <div id="registration-list" class="feature-list" aria-live="polite">
                <div class="card-etoms"><div class="empty"><h3>Đang tải đơn...</h3></div></div>
            </div>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/registration-review.js" defer></script>
</body>
</html>
