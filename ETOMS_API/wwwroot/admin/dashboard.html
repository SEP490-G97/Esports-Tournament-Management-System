<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê hệ thống – ETOMS</title>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin-ext.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container-etoms ax-page">
    <nav id="admin-nav" class="ax-nav"></nav>

    <div class="ax-head">
      <div>
        <h1 class="ax-title">Thống kê toàn hệ thống</h1>
        <p class="ax-sub" id="updated">Đang tải số liệu…</p>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <label for="range" class="ax-sub mb-0">Khoảng thời gian</label>
        <select id="range" class="ax-select" style="width:auto">
          <option value="7">7 ngày</option>
          <option value="30" selected>30 ngày</option>
          <option value="90">90 ngày</option>
          <option value="180">180 ngày</option>
          <option value="365">365 ngày</option>
        </select>
        <button type="button" class="ax-btn ghost" id="refresh">Làm mới</button>
      </div>
    </div>

    <div id="error" class="ax-error" role="alert" hidden></div>

    <section class="ax-stats" id="stats" aria-label="Chỉ số tổng quan"></section>

    <section class="ax-card">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
        <div>
          <h2 class="ax-card-title">Người dùng đăng ký mới</h2>
          <div class="ax-sub" id="users-sub"></div>
        </div>
        <button type="button" class="ax-btn ghost sm" id="toggle-table" aria-pressed="false">Xem dạng bảng</button>
      </div>
      <div class="ax-chart" id="chart-users" role="img" aria-label="Biểu đồ đường người dùng đăng ký mới theo ngày"></div>
      <div class="ax-table-wrap" id="table-users" hidden style="max-height:300px; overflow:auto"></div>
    </section>

    <div class="ax-grid-2 mt-3">
      <section class="ax-card">
        <h2 class="ax-card-title">Top game có nhiều giải đấu nhất</h2>
        <div class="ax-sub mb-3">Tính các giải đã công bố trở đi (không gồm bản nháp).</div>
        <div id="bars-games"></div>
      </section>
      <section class="ax-card">
        <h2 class="ax-card-title">Giải đấu theo trạng thái</h2>
        <div class="ax-sub mb-3">Toàn bộ giải đấu trong hệ thống.</div>
        <div id="bars-status"></div>
      </section>
    </div>

    <p class="ax-foot" id="definitions"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js?v=tel-20261118"></script>
  <script src="/js/admin-common.js?v=adm3-20261118"></script>
  <script src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
