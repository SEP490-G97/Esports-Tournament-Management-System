<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhật ký hệ thống – ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=logo-20261128">
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="page-head">
            <h1 id="page-title">Nhật ký hệ thống</h1>
            <p>Mọi thao tác có thẩm quyền đều để lại một dòng nhật ký. Nhật ký chỉ để đọc: không ai sửa hay xóa được.</p>
        </div>

        <div id="flash" aria-live="polite"></div>

        <section class="card-etoms mb-3"><div class="body">
            <form id="log-filter" class="row gx-3 gy-4 align-items-end audit-filter" novalidate>
                <div class="col-12 col-md-4 field"><label for="lf-action">Loại thao tác</label><select id="lf-action" name="actionType" class="select"><option value="">Tất cả</option></select></div>
                <div class="col-12 col-md-4 field"><label for="lf-keyword">Người thực hiện (tên hoặc email)</label><input id="lf-keyword" name="keyword" class="input" maxlength="100" /><span class="field-error" data-field-error="keyword"></span></div>
                <div class="col-12 col-md-4 field"><label for="lf-tour">Mã giải</label><input id="lf-tour" name="tournamentId" type="number" min="1" class="input" /></div>
                <div class="col-6 col-md-4 field"><label for="lf-from">Từ ngày</label><input id="lf-from" name="from" type="date" class="input" /><span class="field-error" data-field-error="from"></span></div>
                <div class="col-6 col-md-4 field"><label for="lf-to">Đến ngày</label><input id="lf-to" name="to" type="date" class="input" /></div>
                <div class="col-12 col-md-4 audit-filter-actions"><button type="reset" class="btn btn-ghost">Xóa lọc</button></div>
            </form>
        </div></section>

        <div id="log-root"><div class="card-etoms"><div class="empty"><h3>Đang tải…</h3></div></div></div>
    </main>

    <div id="confirm-modal-root"></div>
    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js?v=tab-20261128"></script>
    <script src="/js/api.js?v=form-20261118"></script>
    <script src="/js/ui.js?v=av-20261128"></script>
    <script src="/js/layout.js?v=rt-20261128"></script>
    <script src="/js/pages/audit-log.js?v=af-20261123" defer></script>
</body>
</html>
