<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tin tức · ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=fix-20261122" />
</head>
<body>
    <div id="site-header"></div>
    <main class="container-etoms py-4">
        <div class="page-head mb-3">
            <div class="eyebrow">Cập nhật</div>
            <h1>Tin tức esports</h1>
            <p>Tin của ETOMS và tin thể thao điện tử mới nhất từ các trang báo. Bấm vào tin để đọc ngay trên ETOMS; tin của báo có nút đọc toàn bài trên trang báo.</p>
        </div>

        <!-- Đọc một bài tin ETOMS (?id=) -->
        <article id="news-article" class="card-etoms mb-4" hidden></article>

        <div class="news-toolbar">
            <div id="news-sources" class="news-chips" role="tablist" aria-label="Lọc theo nguồn tin"></div>
            <label class="visually-hidden" for="news-search">Tìm tin</label>
            <input id="news-search" class="input news-search" type="search" maxlength="100" placeholder="Tìm tin: LMHT, PUBG, Valorant…" autocomplete="off" />
        </div>
        <div id="news-flash" aria-live="polite"></div>
        <div id="news-list" class="news-cards" aria-live="polite">
            <div class="card-etoms"><div class="empty"><h3>Đang tải tin…</h3></div></div>
        </div>
        <div class="text-center mt-4"><button id="news-more" class="btn btn-ghost" type="button" hidden>Xem thêm tin</button></div>
        <p id="news-note" class="field-hint mt-3"></p>
    </main>
    <div id="confirm-modal-root"></div>
    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js?v=login-20261115"></script>
    <script src="/js/api.js?v=form-20261118"></script>
    <script src="/js/ui.js?v=join-20261115"></script>
    <script src="/js/layout.js?v=fix-20261122"></script>
    <script src="/js/pages/news.js?v=reader-20261118" defer></script>
</body>
</html>
