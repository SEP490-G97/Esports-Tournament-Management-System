<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khởi tạo đội tuyển · ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="page-head">
            <h1>Khởi tạo đội tuyển</h1>
            <p>Tạo hồ sơ đội của bạn. Hệ thống sẽ tự sinh mã đội và đặt bạn làm đội trưởng.</p>
        </div>

        <div class="card-etoms form-narrow">
            <div class="body">
                <div id="flash"></div>

                <form id="create-form" novalidate>
                    <div class="field">
                        <label for="Name">Tên đội <span class="req">*</span></label>
                        <input id="Name" name="Name" class="input" maxlength="200" placeholder="Ví dụ: Saigon Phantom" />
                        <span class="field-error" data-field-error="Name"></span>
                    </div>

                    <div class="field">
                        <label for="Tag">Thẻ đội (Team Tag) <span class="req">*</span></label>
                        <input id="Tag" name="Tag" class="input" maxlength="20" placeholder="Ví dụ: SGP" />
                        <div class="hint">Chỉ gồm chữ cái không dấu và chữ số, 2–20 ký tự, không khoảng trắng.</div>
                        <span class="field-error" data-field-error="Tag"></span>
                    </div>

                    <div class="field">
                        <label for="GameId">Tựa game chủ đạo <span class="req">*</span></label>
                        <select id="GameId" name="GameId" class="select">
                            <option value="">— Chọn tựa game —</option>
                        </select>
                        <span class="field-error" data-field-error="GameId"></span>
                    </div>

                    <div class="field">
                        <label for="logoFile">Logo đội</label>
                        <input type="file" id="logoFile" name="logoFile" class="input" accept=".jpg,.jpeg,.png,.webp" />
                        <div class="hint">Định dạng JPG, PNG hoặc WEBP. Dung lượng tối đa 2MB.</div>
                        <span class="field-error" data-field-error="logoFile"></span>
                        <img id="logoPreview" class="logo-preview" alt="Xem trước logo" style="display:none" />
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary">Tạo đội</button>
                        <a href="/team/index.html" class="btn btn-ghost">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/team-create.js" defer></script>
</body>
</html>
