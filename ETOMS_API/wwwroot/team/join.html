<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gia nhập đội · ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=role-20261115" />
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="eyebrow">Đội tuyển · Gia nhập</div>
        <div class="page-head"><h1>Gia nhập đội bằng mã mời</h1><p>Nhập mã mời do đội trưởng cung cấp để trở thành thành viên của đội.</p></div>

        <div class="card-etoms form-narrow"><div class="body">
            <div id="flash"></div>
            <form id="join-form" novalidate>
                <div class="field">
                    <label for="Code">Mã mời <span class="req">*</span></label>
                    <input id="Code" name="Code" class="input" maxlength="40" placeholder="Ví dụ: ABCD2345" style="font-family:monospace;letter-spacing:2px;text-transform:uppercase" autofocus />
                    <div class="hint">Mã gồm 8 ký tự, nhận từ đội trưởng.</div>
                    <span class="field-error" data-field-error="Code"></span>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">Gia nhập đội</button>
                    <a href="/team/index.html" class="btn btn-ghost">Hủy</a>
                </div>
            </form>
        </div></div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js?v=login-20261115"></script>
    <script src="/js/api.js?v=login-20261115"></script>
    <script src="/js/ui.js?v=login-20261115"></script>
    <script src="/js/layout.js?v=role-20261115"></script>
    <script src="/js/pages/team-join.js?v=role-20261115" defer></script>
</body>
</html>
