<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập hệ thống ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <style>
        .login-wrap {
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 384px;
            padding: 32px;
            box-sizing: border-box;
            background: #181922;
            border-radius: 12px;
            outline: 1px #282937 solid;
            outline-offset: -1px;
            box-shadow: 0px 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 24px;
            font-family: Inter, sans-serif;
        }

        .login-head {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .login-eyebrow {
            color: #9BA1B6;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 16px;
            letter-spacing: 0.6px;
        }

        .login-title {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            line-height: 32px;
            margin: 0;
        }

        .login-form {
            padding-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-label {
            color: #CBD5E1;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
        }

        .login-link {
            color: #3B82F6;
            font-size: 12px;
            font-weight: 500;
            line-height: 16px;
            text-decoration: none;
            cursor: pointer;
        }

            .login-link:hover {
                text-decoration: underline;
            }

        .login-input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .login-input {
            width: 100%;
            height: 44px;
            box-sizing: border-box;
            padding: 0 14px;
            background: #12131A;
            color: #E2E8F0;
            font-family: Inter, sans-serif;
            font-size: 14px;
            font-weight: 400;
            border: 0;
            border-radius: 8px;
            outline: 1px #282937 solid;
            outline-offset: -1px;
        }

            .login-input::placeholder {
                color: #64748B;
            }

            .login-input:focus {
                outline: 2px #3B82F6 solid;
                outline-offset: -2px;
            }

            .login-input.has-icon {
                padding-right: 44px;
            }

        .login-eye {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #94A3B8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .login-eye:hover {
                color: #E2E8F0;
            }

        .login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #CBD5E1;
            font-size: 14px;
            line-height: 20px;
            cursor: pointer;
            margin: 0;
        }

            .login-remember input {
                width: 18px;
                height: 18px;
                accent-color: #3B82F6;
                cursor: pointer;
                margin: 0;
            }

        .login-submit {
            height: 44px;
            background: #3B82F6;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-family: Inter, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
        }

            .login-submit:hover {
                background: #2563EB;
            }

            .login-submit:disabled {
                opacity: .6;
                cursor: not-allowed;
            }

        .login-error {
            display: none;
            color: #F87171;
            font-size: 13px;
        }

        .login-foot {
            padding-top: 24px;
            border-top: 1px #282937 solid;
            display: flex;
            justify-content: center;
            gap: 4px;
            font-size: 14px;
            line-height: 20px;
        }

            .login-foot span {
                color: #94A3B8;
            }

            .login-foot a {
                color: #3B82F6;
                font-weight: 500;
                text-decoration: none;
            }

                .login-foot a:hover {
                    text-decoration: underline;
                }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #64748B;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

            .login-divider::before,
            .login-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #282937;
            }

        .login-google {
            height: 44px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #12131A;
            color: #E2E8F0;
            border: 0;
            border-radius: 8px;
            outline: 1px #282937 solid;
            outline-offset: -1px;
            font-family: Inter, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

            .login-google:hover {
                background: #1c1e2a;
            }

        .login-google-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="login-wrap">
            <div class="login-card">
                <div class="login-head">
                    <div class="login-eyebrow">ETOMS System</div>
                    <h1 class="login-title">Đăng nhập</h1>
                </div>

                <form id="login-form" class="login-form" novalidate>
                    <div class="login-field">
                        <label class="login-label" for="login-identity">Email / Tên tài khoản</label>
                        <input type="text" id="login-identity" name="identity" class="login-input"
                               placeholder="name@example.com hoặc gamer tag"
                               autocomplete="username" required>
                    </div>

                    <div class="login-field">
                        <div class="login-label-row">
                            <label class="login-label" for="login-password">Mật khẩu</label>
                            <a class="login-link" id="forgot-link" href="#">Quên mật khẩu?</a>
                        </div>
                        <div class="login-input-box">
                            <input type="password" id="login-password" name="password" class="login-input has-icon"
                                   placeholder="••••••••"
                                   autocomplete="current-password" required>
                            <button type="button" id="toggle-password" class="login-eye" aria-label="Hiện mật khẩu">
                                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <label class="login-remember" for="login-remember">
                        <input type="checkbox" id="login-remember" name="remember" checked>
                        Ghi nhớ đăng nhập
                    </label>

                    <div id="login-error" class="login-error" role="alert"></div>

                    <button type="submit" id="login-submit" class="login-submit">Đăng nhập</button>
                </form>
                <div class="login-divider"><span>hoặc</span></div>

                <button type="button" id="google-login" class="login-google">
                    <img src="/images/google-color.svg" alt="" width="18" height="18" class="login-google-icon">
                    Đăng nhập với Google
                </button>

                <div class="login-foot">
                    <span>Chưa có tài khoản?</span>
                    <a id="register-link" href="/auth/register.html">Đăng ký</a>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/dev-auth.js" defer></script>
    <script>
                // Hiện / ẩn mật khẩu
                (function () {
                    var pwd = document.getElementById('login-password');
                    var btn = document.getElementById('toggle-password');
                    btn.addEventListener('click', function () {
                        var show = pwd.type === 'password';
                        pwd.type = show ? 'text' : 'password';
                        btn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                        btn.style.color = show ? '#3B82F6' : '';
                    });
                })();

                // Submit form: dev-auth.js có thể nghe sự kiện 'submit' của #login-form hoặc đọc
                // #login-identity / #login-password. Ngăn reload trang mặc định.
                document.getElementById('login-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                });

                //login với google, điều hướng về controller
        document.getElementById('google-login').addEventListener('click', function () {
            window.location.href = '/auth/google';
        });
    </script>
</body>
</html>
