<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu · ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=ui-2026-11" />
    <link rel="stylesheet" href="/css/loginpage.css?v=ui-2026-11" />
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="login-wrap">
            <div class="login-card">
                <div class="login-head">
                    <div class="login-eyebrow">ETOMS System</div>
                    <h1 class="login-title">Quên mật khẩu</h1>
                </div>
                <!-- Chưa có API đặt lại mật khẩu (AUTH): trang chỉ hướng dẫn, không gửi gì lên server. -->
                <div class="alert alert-info-etoms" role="status">
                    Chức năng đặt lại mật khẩu qua email đang được phát triển. Trong lúc chờ, bạn có thể đăng nhập bằng Google
                    hoặc liên hệ quản trị viên để được hỗ trợ.
                </div>
                <div class="btn-row">
                    <a class="btn btn-primary" href="/auth/login.html">Quay lại đăng nhập</a>
                    <a class="btn btn-ghost" href="/">Về trang chủ</a>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
</body>
</html>
