<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập hệ thống ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <style>
        
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="reg-card">
            <style>
                .reg-card {
                    width: 100%;
                    max-width: 400px;
                    margin: 16px auto;
                    padding: 32px;
                    box-sizing: border-box;
                    background: #181922;
                    border-radius: 12px;
                    outline: 1px #282937 solid;
                    outline-offset: -1px;
                    box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
                    display: flex;
                    flex-direction: column;
                    gap: 24px;
                    font-family: Inter, sans-serif;
                }

                    .reg-card * {
                        box-sizing: border-box;
                    }

                .reg-brand {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    color: #3B82F6;
                    font-size: 12px;
                    font-weight: 600;
                    text-transform: uppercase;
                    letter-spacing: .6px;
                }

                .reg-title {
                    color: #fff;
                    font-size: 24px;
                    font-weight: 700;
                    line-height: 32px;
                    margin: 8px 0 4px;
                }

                .reg-sub {
                    color: #9BA1B6;
                    font-size: 14px;
                    line-height: 20px;
                    margin: 0;
                }

                .reg-form {
                    display: flex;
                    flex-direction: column;
                    gap: 16px;
                }

                .reg-field {
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                }

                .reg-label {
                    color: #CBD5E1;
                    font-size: 12px;
                    font-weight: 600;
                    text-transform: uppercase;
                    letter-spacing: .6px;
                }

                .reg-box {
                    position: relative;
                    display: flex;
                    align-items: center;
                }

                .reg-input {
                    width: 100%;
                    height: 44px;
                    padding: 0 44px 0 14px;
                    background: #12131A;
                    color: #E2E8F0;
                    font-family: Inter, sans-serif;
                    font-size: 14px;
                    border: 0;
                    border-radius: 8px;
                    outline: 1px #282937 solid;
                    outline-offset: -1px;
                }

                    .reg-input::placeholder {
                        color: #64748B;
                    }

                    .reg-input:focus {
                        outline: 2px #3B82F6 solid;
                        outline-offset: -2px;
                    }

                .reg-icon {
                    position: absolute;
                    right: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: #94A3B8;
                    pointer-events: none;
                    display: flex;
                }

                .reg-terms {
                    display: flex;
                    align-items: flex-start;
                    gap: 8px;
                    color: #CBD5E1;
                    font-size: 14px;
                    line-height: 20px;
                    cursor: pointer;
                    margin: 0;
                }

                    .reg-terms input {
                        width: 18px;
                        height: 18px;
                        margin: 1px 0 0;
                        flex-shrink: 0;
                        accent-color: #3B82F6;
                        cursor: pointer;
                    }

                    .reg-terms a, .reg-foot a {
                        color: #3B82F6;
                        font-weight: 500;
                        text-decoration: none;
                    }

                        .reg-terms a:hover, .reg-foot a:hover {
                            text-decoration: underline;
                        }

                .reg-submit {
                    height: 44px;
                    background: #3B82F6;
                    color: #fff;
                    border: 0;
                    border-radius: 8px;
                    font-family: Inter, sans-serif;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                }

                    .reg-submit:hover {
                        background: #2563EB;
                    }

                .reg-foot {
                    padding-top: 24px;
                    border-top: 1px #282937 solid;
                    display: flex;
                    justify-content: center;
                    gap: 6px;
                    font-size: 14px;
                    line-height: 20px;
                    color: #94A3B8;
                }
            </style>

            <div>
                <div class="reg-brand">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="12" x2="10" y2="12" /><line x1="8" y1="10" x2="8" y2="14" /><line x1="15" y1="13" x2="15.01" y2="13" /><line x1="18" y1="11" x2="18.01" y2="11" /><rect x="2" y="6" width="20" height="12" rx="4" /></svg>
                    ETOMS System
                </div>
                <h1 class="reg-title">Đăng ký tài khoản</h1>
                <p class="reg-sub">Nhập thông tin chi tiết bên dưới để tạo tài khoản mới.</p>
            </div>

            <form class="reg-form" id="register-form" novalidate>
                <div class="reg-field">
                    <label class="reg-label" for="reg-gamertag">Tên người dùng / Gamertag</label>
                    <div class="reg-box">
                        <input class="reg-input" type="text" id="reg-gamertag" name="gamertag" placeholder="VD: ViperX#7799" autocomplete="username" required>
                        <span class="reg-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M6 17c.5-2 2-3 3-3s2.5 1 3 3" /><line x1="15" y1="10" x2="18" y2="10" /><line x1="15" y1="14" x2="18" y2="14" /></svg></span>
                    </div>
                </div>

                <div class="reg-field">
                    <label class="reg-label" for="reg-email">Email</label>
                    <div class="reg-box">
                        <input class="reg-input" type="email" id="reg-email" name="email" placeholder="name@example.com" autocomplete="email" required>
                        <span class="reg-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><polyline points="3 7 12 13 21 7" /></svg></span>
                    </div>
                </div>

                <div class="reg-field">
                    <label class="reg-label" for="reg-password">Mật khẩu</label>
                    <div class="reg-box">
                        <input class="reg-input" type="password" id="reg-password" name="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" minlength="8" required>
                        <span class="reg-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg></span>
                    </div>
                </div>

                <div class="reg-field">
                    <label class="reg-label" for="reg-confirm">Xác nhận mật khẩu</label>
                    <div class="reg-box">
                        <input class="reg-input" type="password" id="reg-confirm" name="confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                        <span class="reg-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><polyline points="3 3 3 8 8 8" /><path d="M9 12l2 2 4-4" /></svg></span>
                    </div>
                </div>

                <label class="reg-terms" for="reg-agree">
                    <input type="checkbox" id="reg-agree" name="agree" checked>
                    <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a></span>
                </label>

                <button type="submit" class="reg-submit">Đăng ký tài khoản</button>
            </form>

            <div class="reg-foot">
                <span>Đã có tài khoản?</span>
                <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/dev-auth.js" defer></script>
    <script>
     
    </script>
</body>
</html>
