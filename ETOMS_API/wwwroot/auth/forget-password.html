<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=role-20261115" />
    <link rel="stylesheet" href="/css/auth-card.css" />
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="reg-card">
            <div>
                <div class="reg-brand">ETOMS System</div>
                <h1 class="reg-title">Quên mật khẩu</h1>
                <p class="reg-sub">Nhập email tài khoản, chúng tôi sẽ gửi liên kết đặt lại mật khẩu (có hiệu lực 30 phút).</p>
            </div>

            <form class="reg-form" id="forgot-form" novalidate>
                <div class="reg-field">
                    <label class="reg-label" for="email">Email</label>
                    <div class="reg-box">
                        <input class="reg-input no-icon" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" maxlength="256" required>
                    </div>
                </div>
                <p id="msg" class="form-msg" role="alert" hidden></p>
                <button type="submit" id="submit" class="reg-submit">Gửi liên kết đặt lại</button>
            </form>

            <div class="reg-foot">
                <a href="login.html">Quay lại đăng nhập</a>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js?v=login-20261115"></script>
    <script src="/js/api.js?v=login-20261115"></script>
    <script src="/js/ui.js?v=login-20261115"></script>
    <script src="/js/layout.js?v=role-20261115"></script>
    <script src="/js/auth-forms.js"></script>
    <script src="/js/pages/forget-password.js?v=auth-20261114"></script>
</body>
</html>
