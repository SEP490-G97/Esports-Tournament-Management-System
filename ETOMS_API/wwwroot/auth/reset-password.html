<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu | ETOMS</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/auth-card.css" />
</head>
<body>
    <div id="site-header"></div>

    <main class="container-etoms">
        <div class="reg-card">
            <div>
                <div class="reg-brand">ETOMS System</div>
                <h1 class="reg-title">Đặt lại mật khẩu</h1>
                <p class="reg-sub">Nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>

            <form class="reg-form" id="reset-form" novalidate>
                <div class="reg-field">
                    <label class="reg-label" for="password">Mật khẩu mới</label>
                    <div class="reg-box">
                        <input class="reg-input no-icon" type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" maxlength="72" required>
                    </div>
                    <span class="reg-hint">Gồm chữ hoa, chữ thường và chữ số.</span>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="confirm">Xác nhận mật khẩu mới</label>
                    <div class="reg-box">
                        <input class="reg-input no-icon" type="password" id="confirm" name="confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" maxlength="72" required>
                    </div>
                </div>
                <p id="msg" class="form-msg" role="alert" hidden></p>
                <button type="submit" id="submit" class="reg-submit">Đặt lại mật khẩu</button>
            </form>

            <div class="reg-foot">
                <a id="again" href="forget-password.html" hidden>Yêu cầu liên kết mới</a>
                <a id="login-link" href="login.html" hidden>Đi tới trang đăng nhập</a>
            </div>
        </div>
    </main>

    <div id="confirm-modal-root"></div>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/auth-forms.js"></script>
    <script src="/js/pages/reset-password.js"></script>
</body>
</html>
