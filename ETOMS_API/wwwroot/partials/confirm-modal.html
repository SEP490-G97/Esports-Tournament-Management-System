<div id="etoms-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="etoms-modal-title">
    <div class="modal-box">
        <div class="modal-title" id="etoms-modal-title">Xác nhận</div>
        <div class="modal-msg" id="etoms-modal-msg"></div>
        <div class="modal-field" id="etoms-modal-field" hidden>
            <textarea class="input" id="etoms-modal-input" rows="3"></textarea>
            <div class="field-error" id="etoms-modal-error" aria-live="polite"></div>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="etoms-modal-cancel">Hủy</button>
            <button type="button" class="btn btn-primary" id="etoms-modal-ok">Đồng ý</button>
        </div>
    </div>
</div>
